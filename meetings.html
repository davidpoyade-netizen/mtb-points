<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Événements – MTB Points</title>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/theme-nature.css" />
</head>

<body class="theme-nature">
  <!-- Header commun injecté -->
  <div id="app-header"></div>

  <main class="wrap">
    <section class="card">
      <div class="heroTop" style="align-items:flex-end;">
        <div>
          <h2 style="margin:0;">Événements</h2>
          <div class="heroDesc">Liste des événements publiés</div>
        </div>
        <div class="heroActions">
          <a class="btn primary" href="meeting-create.html">➕ Créer un événement</a>
          <a class="btn" href="index.html">🏠 Accueil</a>
        </div>
      </div>

      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input id="q" type="search" placeholder="Rechercher un événement (nom, lieu)…" style="flex:1 1 360px;" />
        <label style="display:flex; align-items:center; gap:8px; user-select:none;">
          <input id="onlyPublished" type="checkbox" checked />
          Publiés uniquement
        </label>
      </div>

      <div id="status" class="hintRow" style="margin-top:12px;">Chargement…</div>
      <div id="meetingsList" class="list"></div>
    </section>
  </main>

  <!-- Header loader (auth + active link) -->
  <script type="module" src="./js/header.js"></script>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fmtDate(d) {
      return d ? String(d) : "";
    }

    async function loadMeetings() {
      const status = $("status");
      const list = $("meetingsList");
      const q = ($("q")?.value || "").trim().toLowerCase();
      const onlyPublished = !!$("onlyPublished")?.checked;

      status.textContent = "Chargement…";
      list.innerHTML = "";

      // ⚠️ IMPORTANT: ta table meetings n'a PAS forcément "country"
      // On ne sélectionne que les colonnes sûres: id,name,location,date,end_date,is_published
      let query = supabase
        .from("meetings")
        .select("id,name,location,date,end_date,is_published")
        .order("date", { ascending: false });

      if (onlyPublished) query = query.eq("is_published", true);

      const { data, error } = await query;

      if (error) {
        console.error("[meetings] supabase error:", error);
        status.textContent = "❌ Erreur : " + error.message;
        return;
      }

      const rows = (data || []).filter((m) => {
        if (!q) return true;
        const hay = `${m.name ?? ""} ${m.location ?? ""}`.toLowerCase();
        return hay.includes(q);
      });

      if (rows.length === 0) {
        status.textContent = "Aucun événement.";
        list.innerHTML = `<div class="empty">Aucun événement trouvé.</div>`;
        return;
      }

      status.textContent = `${rows.length} événement(s)`;

      rows.forEach((m) => {
        const aWhere = m.location ? `📍 ${escapeHtml(m.location)}` : "📍 Lieu non précisé";
        const when = `${fmtDate(m.date)}${m.end_date ? " → " + fmtDate(m.end_date) : ""}`;

        const card = document.createElement("a");
        card.className = "item";
        card.href = `races.html?meeting_id=${encodeURIComponent(m.id)}`;
        card.innerHTML = `
          <div class="topline">
            <div class="title">${escapeHtml(m.name || "")}</div>
            <span class="badge">${m.is_published ? "✅ Publié" : "⏳ Brouillon"}</span>
          </div>
          <div class="metaLine">${aWhere}</div>
          <div class="metaLine">📅 ${escapeHtml(when || "Date non précisée")}</div>
          <div class="miniRow">
            <span class="miniPill">Voir les épreuves →</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    $("q")?.addEventListener("input", () => loadMeetings());
    $("onlyPublished")?.addEventListener("change", () => loadMeetings());

    loadMeetings();
  </script>
</body>
</html>
