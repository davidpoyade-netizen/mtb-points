<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  async function loadMeetings() {
    const container = document.getElementById("meetingsList");
    if (!container) return;

    const { data, error } = await supabase
      .from("meetings")
      .select("*")
      .order("date", { ascending: false });

    if (error) {
      console.error("[meetings] supabase error:", error);
      container.textContent = "❌ Erreur de chargement : " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      container.textContent = "Aucun événement";
      return;
    }

    container.innerHTML = "";
    data.forEach((m) => {
      const div = document.createElement("div");
      div.className = "meeting-card";
      div.innerHTML = `
        <h3>${m.name ?? ""}</h3>
        <p>${m.location ?? ""}${m.country ? " (" + m.country + ")" : ""}</p>
        <p>${m.date ?? ""}${m.end_date ? " → " + m.end_date : ""}</p>
        <a href="races.html?meeting_id=${encodeURIComponent(m.id)}">Voir les épreuves</a>
      `;
      container.appendChild(div);
    });
  }

  loadMeetings();
</script>
