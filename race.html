<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiche épreuve — MTB Points</title>

  <!-- Base + thème nature -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-nature.css" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- QR Code -->
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body.theme-nature .panel{
      background: rgba(255,255,255,0.78);
      border:1px solid var(--border);
      border-radius:18px;
      padding:12px;
      box-shadow:0 10px 26px rgba(2,6,23,.06);
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:900px){.grid2{grid-template-columns:1fr}}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    @media(max-width:900px){.kpis{grid-template-columns:1fr}}
    .kpi{border:1px solid var(--border);border-radius:16px;padding:12px;background:rgba(255,255,255,0.82)}
    .kpi .big{font-size:22px;font-weight:1000}
    .kpi .sub{font-size:12px;color:var(--muted)}
    #map,#elevCanvas{height:360px;border-radius:16px;border:1px solid var(--border);background:#fff}
    footer.siteFooter{
      margin-top:18px;padding:14px;border-radius:18px;border:1px solid var(--border);
      background:rgba(255,255,255,0.72);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap
    }
    footer.siteFooter img{width:48px;height:48px;border-radius:12px}
    @media print{
      .noPrint{display:none}
      body{background:#fff}
    }
  </style>
</head>

<body class="theme-nature">

<header class="header noPrint">
  <h1>MTB Points — Fiche épreuve</h1>
  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html">Classement</a>
    <a href="meetings.html">Événements</a>
  </nav>
</header>

<main class="wrap">
  <div class="card">

    <h2 id="raceName">—</h2>
    <p class="muted" id="raceMeta">—</p>

    <div class="kpis">
      <div class="kpi"><div class="big" id="kpiGlobal">—</div><div class="sub">Score global</div></div>
      <div class="kpi"><div class="big" id="kpiPhys">—</div><div class="sub">Score physique</div></div>
      <div class="kpi"><div class="big" id="kpiTech">—</div><div class="sub">Score TechScore</div></div>
    </div>

    <div class="grid2" style="margin-top:16px">
      <div class="panel">
        <h3>Carte du parcours</h3>
        <div id="map"></div>
      </div>
      <div class="panel">
        <h3>Profil altimétrique</h3>
        <canvas id="elevCanvas" width="900" height="360"></canvas>
      </div>
    </div>

    <div class="noPrint" style="margin-top:16px">
      <button onclick="window.print()" class="btn primary">📄 PDF / impression</button>
    </div>

    <footer class="siteFooter">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="img/mtbpoints-logo.png" alt="MTB Points"/>
        <div>
          <strong>Retrouvez vos résultats sur www.mtbpoint.fr</strong><br/>
          <span class="muted small">Scannez pour ouvrir cette fiche</span>
        </div>
      </div>
      <div id="qr"></div>
    </footer>

  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  const raceId = new URLSearchParams(location.search).get("id");
  let map, poly;

  async function loadRace(){
    const { data, error } = await supabase
      .from("v_public_races")
      .select("*")
      .eq("id", raceId)
      .single();

    if(error) return alert("Épreuve introuvable");

    document.getElementById("raceName").textContent = data.name;
    document.getElementById("raceMeta").textContent = data.date + " — " + data.discipline;

    document.getElementById("kpiGlobal").textContent = Math.round(data.score_global || 0);
    document.getElementById("kpiPhys").textContent = Math.round(data.score_phys || 0);
    document.getElementById("kpiTech").textContent = Math.round(data.score_tech || 0);

    drawMap(data.gpx?.points || []);
    drawProfile(data.gpx?.points || []);

    // QR vers le domaine officiel
    new QRCode(document.getElementById("qr"), {
      text: "https://www.mtbpoint.fr/race.html?id=" + encodeURIComponent(raceId),
      width: 96,
      height: 96
    });
  }

  function drawMap(points){
    map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    const latlngs = points.map(p=>[p.lat,p.lng]).filter(p=>p[0]&&p[1]);
    poly = L.polyline(latlngs).addTo(map);
    map.fitBounds(poly.getBounds());
  }

  function drawProfile(points){
    const c = document.getElementById("elevCanvas");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height);
    const els = points.map(p=>p.ele).filter(e=>e!=null);
    if(!els.length) return;
    const min=Math.min(...els), max=Math.max(...els);
    ctx.beginPath();
    els.forEach((e,i)=>{
      const x = i/els.length*c.width;
      const y = c.height-(e-min)/(max-min)*c.height;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.strokeStyle="#2f6f3e";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  loadRace();
</script>

</body>
</html>
