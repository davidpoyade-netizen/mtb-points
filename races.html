<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Épreuves — MTB Points</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .raceGrid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }
    @media(max-width:900px){ .raceGrid{grid-template-columns:1fr} }
    .raceCard{
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      padding:14px;
      box-shadow:0 2px 10px rgba(2,6,23,.05);
    }
    .raceCard h3{margin:0 0 8px 0; font-size:16px; letter-spacing:-.2px}
    .raceMeta{color:var(--muted2); font-size:13px; line-height:1.55}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;border:1px solid var(--border);
      background:#fff;font-weight:900;font-size:12px;white-space:nowrap;
    }
    .badge.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
    .badge.gray{background:#f1f5f9;border-color:#e2e8f0;color:#0f172a}
    .badge.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
    .rowActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    code{background:#f1f5f9;padding:2px 6px;border-radius:8px}
  </style>
</head>

<body>
<header class="header">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1>MTB Points — Épreuves</h1>
    <span class="pill"><span class="dot ok"></span><span id="pillCount">0</span> épreuve(s)</span>
    <span class="pill"><span class="dot"></span><span id="pillStatus">Chargement…</span></span>
  </div>

  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html">Classement</a>
    <a href="meetings.html">Événements</a>
    <a href="races.html" class="active">Épreuves</a>
    <a href="login.html">Connexion</a>
  </nav>

  <div class="headerRight">
    <a class="btn ghost" href="course-create.html">➕ Créer une épreuve</a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <section class="hero">
      <div class="heroTop">
        <div>
          <h2 style="margin:0">Épreuves d’un événement</h2>
          <p class="heroMeta" style="margin:8px 0 0 0">
            Filtre auto via <code>?meeting_id=...</code>
          </p>
        </div>
      </div>

      <div class="rowActions">
        <a class="btn ghost" id="btnAll" href="races.html" style="display:none;">↩️ Voir toutes les épreuves</a>
        <a class="btn ghost" id="btnMeeting" href="meetings.html">🏁 Retour aux événements</a>
      </div>

      <p class="heroDesc" id="scopeLine" style="margin:10px 0 0 0"></p>
    </section>

    <div id="racesList" class="raceGrid" style="margin-top:14px;">Chargement…</div>
    <div id="empty" class="pill" style="margin-top:14px; display:none;"></div>

    <div class="muted2" id="debug" style="margin-top:12px;"></div>
  </div>
</main>

<script type="module">
  // ✅ IMPORTANT: ton fichier est à la racine
  import { supabase } from "./supabaseClient.js";

  const $ = (id)=>document.getElementById(id);

  const params = new URLSearchParams(window.location.search);
  const meetingId = params.get("meeting_id") || params.get("meetingId") || null;

  const listEl = $("racesList");
  const emptyEl = $("empty");
  const pillCount = $("pillCount");
  const pillStatus = $("pillStatus");
  const scopeLine = $("scopeLine");
  const debugEl = $("debug");
  const btnAll = $("btnAll");

  const esc = (s)=>String(s??"").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));

  function badge(label, cls="gray"){
    return `<span class="badge ${cls}">${label}</span>`;
  }

  async function loadRaces(){
    pillStatus.textContent = "Chargement…";
    debugEl.textContent = "";
    emptyEl.style.display = "none";

    if (meetingId){
      scopeLine.innerHTML = `Filtre événement : <code>${esc(meetingId)}</code>`;
      btnAll.style.display = "inline-flex";
    } else {
      scopeLine.textContent = "Aucun meeting_id fourni → affichage de toutes les épreuves (limite 2000).";
    }

    try{
      let q = supabase
        .from("races")
        .select("id,name,date,disc,ebike,level,distance_km,dplus_m,participants,score_phys,score_tech,score_global,meeting_id")
        .order("date", { ascending: false })
        .limit(2000);

      if (meetingId) q = q.eq("meeting_id", meetingId);

      const { data, error } = await q;
      if (error) throw error;

      const rows = data || [];
      pillCount.textContent = String(rows.length);
      pillStatus.textContent = "OK";

      if (!rows.length){
        listEl.innerHTML = "";
        emptyEl.style.display = "inline-flex";
        emptyEl.innerHTML = meetingId
          ? `Aucune épreuve pour cet événement.`
          : `Aucune épreuve trouvée.`;
        return;
      }

      listEl.innerHTML = rows.map(r => {
        const b = [];
        b.push(badge(`🏁 ${esc(r.disc || "—")}`, "blue"));
        if (r.ebike === true) b.push(badge("⚡ E-bike", "ok"));
        if (r.ebike === false) b.push(badge("🚴 Musculaire", "gray"));
        if (r.level) b.push(badge(`📍 ${esc(r.level)}`, "gray"));

        return `
          <article class="raceCard">
            <h3>${esc(r.name || "Épreuve")}</h3>
            <div class="raceMeta">
              ${r.date ? `📅 ${esc(r.date)}` : "📅 —"}
              ${r.meeting_id ? ` • 🧷 meeting_id: ${esc(r.meeting_id)}` : ""}
              <br/>
              Distance: <b>${r.distance_km ?? "?"}</b> km • D+: <b>${r.dplus_m ?? "?"}</b> m • Participants: <b>${r.participants ?? "?"}</b><br/>
              Score global: <b>${r.score_global ?? "-"}</b> (Phys ${r.score_phys ?? "-"} / Tech ${r.score_tech ?? "-"})
            </div>
            <div class="badges">${b.join("")}</div>
            <div class="rowActions" style="margin-top:12px">
              <a class="btn primary" href="event.html?id=${encodeURIComponent(r.id)}">👁️ Fiche épreuve</a>
            </div>
          </article>
        `;
      }).join("");

    } catch(e){
      console.error(e);
      pillStatus.textContent = "Erreur";
      listEl.innerHTML = "";
      emptyEl.style.display = "inline-flex";
      emptyEl.innerHTML = "❌ Erreur de chargement Supabase (RLS / clé / URL / CORS).";
      debugEl.textContent = e?.message ? String(e.message) : "Erreur inconnue";
    }
  }

  loadRaces();
</script>
</body>
</html>
