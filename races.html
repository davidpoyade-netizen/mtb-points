<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Épreuves — MTB Points</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-nature.css" />

  <style>
    .searchBar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-top: 18px;
    }
    
    .searchBar .field {
      flex: 1;
      min-width: 200px;
    }
    
    .searchBar label {
      display: block;
      font-weight: 900;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 6px;
    }
    
    .searchBar input,
    .searchBar select {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(40,60,40,.20);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      font-size: 14px;
    }
    
    .racesList {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }
    
    .raceCard {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 2px 12px rgba(15,23,42,.06);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    
    .raceCard:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15,23,42,.12);
      border-color: rgba(47,111,62,.35);
    }
    
    .raceHeader {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .raceTitle {
      font-weight: 1000;
      font-size: 16px;
      color: var(--text);
      margin: 0 0 6px 0;
    }
    
    .raceMeta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }
    
    .raceMeta .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.75);
      font-size: 11px;
      font-weight: 900;
    }
    
    .raceStats {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(40,60,40,.12);
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .stat .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 900;
    }
    
    .stat .value {
      font-size: 15px;
      font-weight: 1000;
      color: var(--text);
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    
    .badge.published {
      background: #16a34a;
    }
    
    .badge.draft {
      background: #94a3b8;
    }
    
    .emptyState {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    
    .emptyState h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    
    .emptyState p {
      margin: 0;
      font-size: 14px;
    }
  </style>
</head>

<body class="theme-nature">

<header class="header">
  <div class="brandRow">
    <div class="brandLogo" title="MTB Points">
      <img src="img/mtbpoints-coins.png" alt="MTB Points — Coins">
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1>MTB Points — Épreuves</h1>
      <span class="pill"><span class="dot ok"></span> <span id="countRaces">0</span> épreuve(s)</span>
    </div>
  </div>

  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html">Classement</a>
    <a href="meetings.html">Événements</a>
    <a href="races.html" class="active">Épreuves</a>
    <a href="login.html">Connexion</a>
  </nav>
</header>

<main class="wrap">
  <div class="card">
    <section class="hero">
      <div class="heroTop">
        <div>
          <h2 style="margin:0">Toutes les épreuves</h2>
          <div class="muted" style="margin-top:6px">
            Consultez les classements et résultats de chaque épreuve
          </div>
        </div>
        <div class="heroActions">
          <button class="btn ghost" id="btnReset" type="button">Réinitialiser</button>
          <button class="btn primary" id="btnRefresh" type="button">Actualiser</button>
        </div>
      </div>

      <!-- Barre de recherche -->
      <div class="searchBar">
        <div class="field">
          <label for="searchName">Recherche</label>
          <input type="text" id="searchName" placeholder="Nom de l'épreuve..." />
        </div>
        
        <div class="field" style="max-width: 200px">
          <label for="filterDiscipline">Discipline</label>
          <select id="filterDiscipline">
            <option value="">Toutes</option>
            <option value="XCO">XCO</option>
            <option value="XCC">XCC</option>
            <option value="XCM">XCM</option>
            <option value="DH">DH</option>
            <option value="Enduro">Enduro</option>
            <option value="Gravel">Gravel</option>
          </select>
        </div>
        
        <div class="field" style="max-width: 200px">
          <label for="filterYear">Année</label>
          <select id="filterYear">
            <option value="">Toutes</option>
          </select>
        </div>
        
        <div class="field" style="max-width: 200px">
          <label for="filterStatus">Statut</label>
          <select id="filterStatus">
            <option value="">Tous</option>
            <option value="published">Publiées</option>
            <option value="draft">Brouillons</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Liste des épreuves -->
    <div class="racesList" id="racesList">
      <div class="emptyState">
        <h3>Aucune épreuve</h3>
        <p>Cliquez sur "Actualiser" pour charger les épreuves</p>
      </div>
    </div>

    <div id="debugInfo" class="muted" style="margin-top: 16px; font-size: 12px;"></div>
  </div>
</main>

<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function formatDistance(meters) {
    if (!meters) return "—";
    const km = (meters / 1000).toFixed(1);
    return `${km} km`;
  }

  function formatElevation(meters) {
    if (!meters) return "—";
    return `${Math.round(meters)} m`;
  }

  // Remplir les années
  function fillYears() {
    const yearSelect = $("filterYear");
    const currentYear = new Date().getFullYear();
    
    for (let y = currentYear; y >= currentYear - 5; y--) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }
  }

  function createRaceCard(race) {
    const card = document.createElement("a");
    card.className = "raceCard";
    card.href = `race-ranking.html?race_id=${race.id}`;
    
    const statusBadge = race.is_published 
      ? '<span class="badge published">✓ Publiée</span>'
      : '<span class="badge draft">Brouillon</span>';
    
    card.innerHTML = `
      <div class="raceHeader">
        <div style="flex:1">
          <h3 class="raceTitle">${esc(race.name || "Épreuve sans nom")}</h3>
          <div class="raceMeta">
            <span class="pill">📅 ${formatDate(race.date)}</span>
            <span class="pill">📍 ${esc(race.location || "—")}</span>
            ${race.discipline ? `<span class="pill">🚴 ${esc(race.discipline)}</span>` : ''}
          </div>
        </div>
        ${statusBadge}
      </div>
      
      <div class="raceStats">
        <div class="stat">
          <div class="label">Distance</div>
          <div class="value">${formatDistance(race.distance_m)}</div>
        </div>
        <div class="stat">
          <div class="label">D+</div>
          <div class="value">${formatElevation(race.elevation_gain_m)}</div>
        </div>
        <div class="stat">
          <div class="label">Participants</div>
          <div class="value">${race.participant_count || 0}</div>
        </div>
        <div class="stat">
          <div class="label">Score MTB</div>
          <div class="value">${race.mtb_score || "—"}</div>
        </div>
      </div>
    `;
    
    return card;
  }

  async function loadRaces() {
    const btnRefresh = $("btnRefresh");
    btnRefresh.disabled = true;
    btnRefresh.textContent = "Chargement...";
    
    try {
      const { data, error } = await supabase
        .from("races")
        .select(`
          id,
          name,
          date,
          location,
          discipline,
          distance_m,
          elevation_gain_m,
          mtb_score,
          is_published,
          participant_count
        `)
        .order("date", { ascending: false })
        .limit(100);

      if (error) throw error;

      const races = data || [];
      
      // Afficher les épreuves
      const racesList = $("racesList");
      racesList.innerHTML = "";
      
      if (races.length === 0) {
        racesList.innerHTML = `
          <div class="emptyState">
            <h3>Aucune épreuve trouvée</h3>
            <p>Les épreuves apparaîtront ici une fois créées</p>
          </div>
        `;
      } else {
        races.forEach(race => {
          racesList.appendChild(createRaceCard(race));
        });
      }
      
      // Mettre à jour le compteur
      $("countRaces").textContent = races.length;
      
      // Debug
      $("debugInfo").textContent = `${races.length} épreuve(s) chargée(s) depuis Supabase`;
      
    } catch (e) {
      console.error("Erreur chargement épreuves:", e);
      
      $("racesList").innerHTML = `
        <div class="emptyState">
          <h3>⚠️ Erreur de chargement</h3>
          <p>${esc(e.message)}</p>
          <p class="muted" style="margin-top:8px;font-size:12px">
            Vérifiez que la table "races" existe et que les policies RLS sont configurées
          </p>
        </div>
      `;
      
      $("debugInfo").textContent = `Erreur : ${e.message}`;
    } finally {
      btnRefresh.disabled = false;
      btnRefresh.textContent = "Actualiser";
    }
  }

  // Filtrage local
  function applyFilters() {
    const searchText = $("searchName").value.toLowerCase();
    const discipline = $("filterDiscipline").value;
    const year = $("filterYear").value;
    const status = $("filterStatus").value;
    
    const cards = document.querySelectorAll(".raceCard");
    let visibleCount = 0;
    
    cards.forEach(card => {
      let visible = true;
      
      // Filtre recherche
      if (searchText) {
        const title = card.querySelector(".raceTitle")?.textContent.toLowerCase() || "";
        if (!title.includes(searchText)) visible = false;
      }
      
      // Filtre discipline
      if (discipline) {
        const disciplinePill = card.querySelector('.pill:nth-child(3)')?.textContent || "";
        if (!disciplinePill.includes(discipline)) visible = false;
      }
      
      // Filtre année
      if (year) {
        const datePill = card.querySelector('.pill:nth-child(1)')?.textContent || "";
        if (!datePill.includes(year)) visible = false;
      }
      
      // Filtre statut
      if (status === 'published' && !card.querySelector('.badge.published')) visible = false;
      if (status === 'draft' && !card.querySelector('.badge.draft')) visible = false;
      
      card.style.display = visible ? "block" : "none";
      if (visible) visibleCount++;
    });
    
    // Afficher message si aucun résultat
    if (visibleCount === 0 && cards.length > 0) {
      if (!$("racesList").querySelector(".emptyState")) {
        const empty = document.createElement("div");
        empty.className = "emptyState";
        empty.innerHTML = `
          <h3>Aucune épreuve ne correspond aux critères</h3>
          <p>Essayez de modifier les filtres</p>
        `;
        $("racesList").appendChild(empty);
      }
    } else {
      const emptyState = $("racesList").querySelector(".emptyState");
      if (emptyState) emptyState.remove();
    }
    
    $("countRaces").textContent = visibleCount;
  }

  // Event listeners
  $("btnRefresh").addEventListener("click", loadRaces);
  
  $("btnReset").addEventListener("click", () => {
    $("searchName").value = "";
    $("filterDiscipline").value = "";
    $("filterYear").value = "";
    $("filterStatus").value = "";
    applyFilters();
  });
  
  $("searchName").addEventListener("input", applyFilters);
  $("filterDiscipline").addEventListener("change", applyFilters);
  $("filterYear").addEventListener("change", applyFilters);
  $("filterStatus").addEventListener("change", applyFilters);

  // Initialisation
  fillYears();
  // Décommentez pour charger automatiquement au démarrage
  // loadRaces();
</script>

</body>
</html>
