<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Épreuves — MTB Points</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root{
      --bg:#f3f7f2;--card:#fff;--text:#0b1220;--muted:#5b6b5f;--border:#dbe6da;
      --blue:#1f7a4d;--blue2:#16623d;--shadow:0 10px 30px rgba(2,6,23,.10);
      --r:16px;--ok:#16a34a;--warn:#ea580c;--err:#dc2626;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);
      background:
        radial-gradient(900px 320px at 14% 0%, rgba(31,122,77,.14), transparent 60%),
        radial-gradient(760px 280px at 92% 10%, rgba(34,197,94,.10), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.65), rgba(243,247,242,1) 38%),
        var(--bg);
    }
    a{color:inherit}
    header.header{
      position:sticky;top:0;z-index:20;
      background:rgba(255,255,255,.90);
      backdrop-filter:saturate(180%) blur(8px);
      border-bottom:1px solid var(--border);
      padding:14px 16px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    header.header h1{margin:0;font-size:18px}
    nav.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    nav.nav a{
      text-decoration:none;padding:8px 10px;border-radius:10px;
      color:var(--blue);font-weight:900;font-size:13px;
    }
    nav.nav a:hover{background:rgba(31,122,77,.08)}
    nav.nav a.active{background:rgba(31,122,77,.10);color:var(--blue2)}
    .wrap{max-width:1100px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
    .hero{
      border-radius:22px;padding:18px;border:1px solid var(--border);
      background:
        radial-gradient(1000px 260px at 15% 0%, rgba(31,122,77,.16), transparent 60%),
        radial-gradient(700px 220px at 95% 10%, rgba(34,197,94,.12), transparent 60%),
        #fff;
      box-shadow:var(--shadow);
    }
    .hero h2{margin:0;font-size:24px;letter-spacing:-.4px}
    .muted{color:var(--muted)}
    .muted2{color:#5b6b5f;font-size:12px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .inp{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none;font-size:14px;min-width:220px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#fff;
      text-decoration:none;font-weight:900;cursor:pointer;
    }
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn.primary:hover{background:var(--blue2);border-color:var(--blue2)}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:900}
    .dot{width:10px;height:10px;border-radius:999px;background:#94a3b8;display:inline-block}
    .dot.ok{background:var(--ok)}
    .dot.warn{background:var(--warn)}
    .dot.err{background:var(--err)}

    .list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    @media(max-width:900px){.list{grid-template-columns:1fr}}
    .raceCard{
      border:1px solid var(--border);border-radius:16px;padding:14px;background:#fff;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .raceCard:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(2,6,23,.08);border-color:#cfe0d0}
    .raceTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .raceName{margin:0;font-size:16px;font-weight:1000}
    .badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .badge{font-size:12px;font-weight:900;border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#fff;white-space:nowrap}
    .badge.pub{border-color:rgba(22,163,74,.35);background:rgba(22,163,74,.10)}
    .badge.draft{border-color:rgba(234,88,12,.35);background:rgba(234,88,12,.10)}
    .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .kpi{border:1px solid var(--border);border-radius:14px;padding:10px;background:#fff;min-width:120px}
    .kpi .l{font-size:12px;color:var(--muted);font-weight:900}
    .kpi .v{font-size:18px;font-weight:1000}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .empty{padding:14px;border:1px dashed var(--border);border-radius:16px;background:rgba(255,255,255,.7);margin-top:12px}
  </style>
</head>

<body>
<header class="header">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1>MTB Points — Épreuves</h1>
    <span class="pill"><span class="dot" id="statusDot"></span> <span id="statusText">Chargement…</span></span>
  </div>

  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html">Classement</a>
    <a href="meetings.html">Événements</a>
    <a href="races.html" class="active">Épreuves</a>
    <a href="login.html">Connexion</a>
  </nav>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <a class="btn primary" href="course-create.html">+ Créer une épreuve</a>
  </div>
</header>

<main class="wrap">
  <section class="card hero">
    <div class="row">
      <div style="min-width:280px;flex:1">
        <h2>Épreuves publiées</h2>
        <div class="muted" style="margin-top:6px">Page publique : seules les épreuves <b>publiées</b> sont visibles sans connexion.</div>
        <div class="muted2" id="hintMeeting" style="margin-top:6px"></div>
      </div>

      <div class="filters">
        <input id="q" class="inp" type="search" placeholder="Rechercher une épreuve…" />
        <button class="btn" id="btnReset" type="button">Réinitialiser</button>
      </div>
    </div>
  </section>

  <section class="card" style="margin-top:14px;">
    <div class="row">
      <div class="muted2" id="countText">—</div>
      <div class="muted2" id="modeText">—</div>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty" style="display:none;">
      <b>Aucune épreuve</b>
      <div class="muted" style="margin-top:6px">Crée une épreuve, puis publie-la pour qu’elle soit visible publiquement.</div>
    </div>
  </section>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const KEY_RACES = "mtb.races.v1";

  function setStatus(ok, text){
    const dot = $("statusDot");
    const t = $("statusText");
    if (dot) dot.style.background = ok ? "#16a34a" : "#dc2626";
    if (t) t.textContent = text || "";
  }

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function num(x){ const n = Number(x); return Number.isFinite(n) ? n : null; }

  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(KEY_RACES);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }

  async function getSupabase(){
    try{
      const mod = await import("./js/supabaseClient.js");
      return mod?.supabase || null;
    }catch(e){
      console.warn("[races] supabase import failed:", e);
      return null;
    }
  }

  function normalizeRow(row){
    return {
      id: row.id,
      meetingId: row.meeting_id,
      name: row.name,
      date: row.date,
      disc: row.discipline,
      level: row.level,
      distanceKm: row.distance_km,
      dplusM: row.dplus_m,
      physScore: row.score_phys,
      techScoreV2: row.score_tech,
      globalScore: row.score_global,
      isPublished: row.is_published
    };
  }

  async function loadSupabase(){
    const supabase = await getSupabase();
    if (!supabase) return { list: null, mode: "local" };

    let isAuthed = false;
    try{
      const { data: sess } = await supabase.auth.getSession();
      isAuthed = !!sess?.session;
    }catch(_){}

    try{
      const meetingId = getParam("meetingId");

      let q = supabase.from("races").select("*").order("date", { ascending: false }).limit(2000);
      if (meetingId) q = q.eq("meeting_id", meetingId);
      if (!isAuthed) q = q.eq("is_published", true);

      const { data, error } = await q;
      if (error) {
        console.warn("[races] supabase error:", error);
        return { list: null, mode: isAuthed ? "authed" : "public" };
      }

      return { list: (data || []).map(normalizeRow), mode: isAuthed ? "authed" : "public" };
    } catch(e){
      console.warn("[races] supabase exception:", e);
      return { list: null, mode: "local" };
    }
  }

  function render(list){
    const q = String($("q")?.value || "").trim().toLowerCase();
    const meetingId = getParam("meetingId");
    const hintMeeting = $("hintMeeting");
    if (hintMeeting) hintMeeting.textContent = meetingId ? `Filtré par meetingId: ${meetingId}` : "";

    const filtered = (list || []).filter(r => {
      if (!r) return false;
      if (!q) return true;
      return String(r.name || "").toLowerCase().includes(q) ||
             String(r.disc || "").toLowerCase().includes(q) ||
             String(r.level || "").toLowerCase().includes(q);
    });

    const listEl = $("list");
    const emptyEl = $("empty");
    if (!listEl) return;

    $("countText").textContent = `${filtered.length} épreuve(s)`;
    if (filtered.length === 0) {
      listEl.innerHTML = "";
      if (emptyEl) emptyEl.style.display = "block";
      return;
    }
    if (emptyEl) emptyEl.style.display = "none";

    listEl.innerHTML = filtered.map(r => {
      const dist = num(r.distanceKm);
      const dplus = num(r.dplusM);
      const phys = num(r.physScore);
      const tech = num(r.techScoreV2);
      const glob = num(r.globalScore);

      const pub = r.isPublished === true;

      return `
        <div class="raceCard">
          <div class="raceTop">
            <div>
              <h3 class="raceName">${esc(r.name || "Épreuve")}</h3>
              <div class="muted2">${esc(r.date || "—")} • ${esc(r.disc || "—")} ${r.level ? "• " + esc(r.level) : ""}</div>
              <div class="muted2">${dist != null ? dist.toFixed(1) + " km" : "—"} • ${dplus != null ? "D+ " + Math.round(dplus) + " m" : "D+ —"}</div>
            </div>
            <div class="badges">
              <span class="badge ${pub ? "pub" : "draft"}">${pub ? "Publié" : "Brouillon"}</span>
              ${r.meetingId ? `<span class="badge">Meeting: ${esc(r.meetingId)}</span>` : ""}
            </div>
          </div>

          <div class="kpis">
            <div class="kpi"><div class="l">Phys</div><div class="v">${phys == null ? "—" : Math.round(phys)}</div></div>
            <div class="kpi"><div class="l">Tech</div><div class="v">${tech == null ? "—" : Math.round(tech)}</div></div>
            <div class="kpi"><div class="l">Global</div><div class="v">${glob == null ? "—" : Math.round(glob)}</div></div>
          </div>

          <div class="actions">
            <a class="btn primary" href="race.html?id=${encodeURIComponent(r.id)}">Voir la fiche</a>
            ${r.meetingId ? `<a class="btn" href="meetings.html">Événements</a>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  async function init(){
    setStatus(true, "Chargement…");

    const { list, mode } = await loadSupabase();
    const data = Array.isArray(list) ? list : loadLocal();

    $("modeText").textContent =
      Array.isArray(list)
        ? (mode === "authed" ? "Mode connecté (drafts visibles)" : "Mode public (publiés)")
        : "Fallback localStorage";

    setStatus(true, Array.isArray(list) ? "OK (Supabase)" : "OK (local)");
    render(data);

    $("q")?.addEventListener("input", () => render(data));
    $("btnReset")?.addEventListener("click", () => { $("q").value = ""; render(data); });
  }

  init();
})();
</script>
</body>
</html>
