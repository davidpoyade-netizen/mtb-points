<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Épreuves – MTB Points</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Épreuves</h1>
  <div id="racesList">Chargement…</div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";

    const params = new URLSearchParams(window.location.search);
    const meetingId = params.get("meeting_id");

    if (!meetingId) {
      document.getElementById("racesList").textContent =
        "❌ meeting_id manquant";
      throw new Error("meeting_id manquant");
    }

    async function loadRaces() {
      const container = document.getElementById("racesList");

      const { data, error } = await supabase
        .from("races")
        .select("*")
        .eq("meeting_id", meetingId)
        .order("name");

      if (error) {
        console.error(error);
        container.textContent = "❌ Erreur de chargement";
        return;
      }

      if (!data || data.length === 0) {
        container.textContent = "Aucune épreuve pour cet événement";
        return;
      }

      container.innerHTML = "";

      data.forEach((r) => {
        const div = document.createElement("div");
        div.className = "race-card";
        div.innerHTML = `
          <h3>${r.name}</h3>
          <p>Discipline : ${r.disc}</p>
          <p>Distance : ${r.distance_km ?? "?"} km</p>
          <p>D+ : ${r.dplus_m ?? "?"} m</p>
          <p>Participants : ${r.participants ?? "?"}</p>
          <p>Score : ${r.score_global ?? "-"}</p>
        `;
        container.appendChild(div);
      });
    }

    loadRaces();
  </script>
</body>
</html>
