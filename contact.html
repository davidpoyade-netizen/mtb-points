<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — MTB Points</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-nature.css?v=20" />

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;color:var(--text)}
    a{color:inherit}

    header.header{
      position:sticky;top:0;z-index:20;
      padding:14px 16px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .brandRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .brandLogo{
      width:44px;height:44px;border-radius:14px;overflow:hidden;
      border:1px solid rgba(40,60,40,.18);
      box-shadow:0 12px 22px rgba(15,23,42,.18);
      background:#fff;
    }
    .brandLogo img{width:100%;height:100%;object-fit:cover;display:block}
    header.header h1{margin:0;font-size:18px;letter-spacing:.2px}

    nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    nav a{
      text-decoration:none;
      padding:8px 10px;border-radius:10px;
      color:var(--blue);
      font-weight:950;font-size:13px;
    }
    nav a:hover{background:rgba(47,111,62,.10)}
    nav a.active{background:rgba(47,111,62,.12);color:var(--blue2)}

    .wrap{max-width:900px;margin:22px auto;padding:0 16px}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    h1{margin:0 0 10px 0;font-size:26px;letter-spacing:-.3px}
    .muted{color:var(--muted);font-size:14px;line-height:1.6}

    label{display:block;margin-top:14px;font-weight:1000;font-size:12px;color:var(--text)}
    input, select, textarea{
      width:100%;
      margin-top:6px;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(40,60,40,.20);
      background:rgba(255,255,255,.82);
      font-size:14px;
      font-family:inherit;
    }
    textarea{min-height:120px;resize:vertical}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}

    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
    button{
      padding:12px 16px;
      border-radius:14px;
      border:1px solid rgba(37,90,49,1);
      background:linear-gradient(180deg, rgba(47,111,62,1), rgba(37,90,49,1));
      color:#fff;
      font-weight:1100;
      cursor:pointer;
    }
    button:hover{
      background:linear-gradient(180deg, rgba(37,90,49,1), rgba(30,76,41,1));
      border-color:rgba(30,76,41,1);
    }

    .msg{margin-top:12px;font-size:14px;font-weight:900}
    footer{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
  </style>
</head>

<body class="theme-nature">
<header class="header">
  <div class="brandRow">
    <div class="brandLogo" title="MTB Points">
      <img src="img/mtbpoints-coins.png" alt="MTB Points — Coins">
    </div>
    <h1>MTB Points — Contact</h1>
  </div>

  <nav>
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html">Classement</a>
    <a href="meetings.html">Événements</a>
    <a href="reglement.html">Règlement</a>
    <a href="about.html">À propos</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main class="wrap">
  <div class="card">
    <h1>Contact</h1>
    <p class="muted">
      Une question sur le scoring, un problème technique, une suggestion d’amélioration ou une demande partenaire ?
      Écris-nous, nous te répondrons rapidement.
    </p>

    <form id="contactForm">
      <div class="row">
        <div>
          <label for="name">Nom</label>
          <input id="name" required placeholder="Ton nom" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="ton@email.fr" />
        </div>
      </div>

      <label for="subject">Sujet</label>
      <select id="subject" required>
        <option value="">— Choisir —</option>
        <option>Question générale</option>
        <option>Problème technique</option>
        <option>Erreur de classement</option>
        <option>Organisateur / partenariat</option>
        <option>Autre</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" required placeholder="Décris ta demande…"></textarea>

      <div class="actions">
        <button type="submit">Envoyer le message</button>
        <span class="msg" id="formMsg"></span>
      </div>
    </form>
  </div>

  <footer>
    MTB Points — Contact
  </footer>
</main>

<script>
  const form = document.getElementById("contactForm");
  const msg = document.getElementById("formMsg");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    msg.textContent = "✅ Message envoyé (démo).";
    msg.style.color = "#16a34a";
    form.reset();
  });
</script>

<script type="module" src="js/contact.js"></script>
</body>
</html>
