  Remplacer les fonctions listMeetingsSafe() et findMeetingSafe()
  aux lignes 495-508 par ce code :

<script type="module">
// Import Supabase
let supabase = null;
try {
  const mod = await import('./js/supabaseClient.js');
  supabase = mod?.supabase || null;
  console.log("✅ Supabase client chargé");
} catch(e) {
  console.warn("⚠️ Supabase non disponible, fallback localStorage uniquement:", e);
}

(function(){
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  // ============================================================
  // FONCTIONS CORRIGÉES - REMPLACER LES ANCIENNES (lignes 495-508)
  // ============================================================
  
  /**
   * Charge tous les meetings depuis Supabase ET localStorage
   * @returns {Promise<Array>} Liste des meetings
   */
  async function listMeetingsHybrid() {
    const localMeetings = [];
    
    // 1. Essayer localStorage d'abord
    try {
      const raw = localStorage.getItem("mtb.meetings.v1");
      const arr = raw ? JSON.parse(raw) : [];
      if (Array.isArray(arr)) localMeetings.push(...arr);
    } catch (e) {
      console.warn("Erreur localStorage meetings:", e);
    }

    // 2. Charger depuis Supabase
    let supaMeetings = [];
    if (supabase) {
      try {
        const { data, error } = await supabase
          .from("meetings")
          .select("*")
          .order("date", { ascending: false });
        
        if (error) throw error;
        supaMeetings = data || [];
      } catch (e) {
        console.warn("Erreur Supabase meetings:", e);
      }
    }

    // 3. Fusionner (Supabase prioritaire)
    const map = new Map();
    localMeetings.forEach(m => map.set(m.id, m));
    supaMeetings.forEach(m => map.set(m.id, m));
    
    return Array.from(map.values());
  }

  /**
   * Trouve un meeting par ID depuis Supabase ET localStorage
   * @param {string} id - ID du meeting
   * @returns {Promise<Object|null>} Le meeting ou null
   */
  async function findMeetingHybrid(id) {
    if (!id) return null;

    // 1. Essayer Supabase d'abord
    if (supabase) {
      try {
        const { data, error } = await supabase
          .from("meetings")
          .select("*")
          .eq("id", id)
          .single();
        
        if (data && !error) return data;
      } catch (e) {
        console.warn("Supabase meeting not found, trying localStorage:", e);
      }
    }

    // 2. Fallback localStorage
    try {
      const raw = localStorage.getItem("mtb.meetings.v1");
      const arr = raw ? JSON.parse(raw) : [];
      const found = Array.isArray(arr) ? arr.find(m => m && m.id === id) : null;
      if (found) return found;
    } catch (e) {
      console.warn("localStorage meeting not found:", e);
    }

    return null;
  }

  // ============================================================
  // FONCTION loadMeetingInfo() CORRIGÉE - REMPLACER (ligne 510)
  // ============================================================
  
  let MEETING_ID = null;
  let MEETING = null;

  async function loadMeetingInfo() {
    MEETING_ID = params.get("meetingId");
    
    if (!MEETING_ID) {
      $("eventName").textContent = "❌ Aucun événement spécifié";
      $("eventDate").textContent = "Retourne à la liste des événements.";
      showMsg("Aucun événement spécifié. Retourne à la liste des événements.", false);
      return;
    }

    // UTILISER LA VERSION ASYNC
    MEETING = await findMeetingHybrid(MEETING_ID);
    
    if (!MEETING) {
      $("eventName").textContent = "❌ Événement introuvable";
      $("eventDate").textContent = `ID: ${MEETING_ID}`;
      showMsg("Événement introuvable dans Supabase et localStorage.", false);
      console.error("Meeting ID not found:", MEETING_ID);
      return;
    }

    $("eventName").textContent = MEETING.name || "Événement";
    
    const start = MEETING.date || "—";
    const end = MEETING.endDate || MEETING.end_date || null;
    const range = end ? `${start} → ${end}` : start;
    $("eventDate").textContent = `📅 ${range}`;
    
    if (MEETING.location) {
      $("eventLocation").textContent = `📍 ${MEETING.location}`;
      $("eventLocation").style.display = "block";
    } else {
      $("eventLocation").style.display = "none";
    }

    const back = $("btnBack");
    if (back) {
      back.href = `meeting.html?id=${encodeURIComponent(MEETING.id)}`;
    }

    console.log("✅ Meeting chargé:", MEETING);
  }

  // ============================================================
  // RESTE DU CODE (à garder tel quel)
  // ============================================================
  
  // ... (toutes vos autres fonctions ici)

  // INIT - IMPORTANT: loadMeetingInfo() est maintenant async
  (async function init() {
    await loadMeetingInfo(); // AWAIT ici car c'est async maintenant
    renderAgeRows();
    initMultiToggle();

    $("btnPickAnalyze")?.addEventListener("click", function() {
      showMsg("");
      const inp = $("gpxFile");
      if (inp) {
        inp.value = "";
        inp.click();
      }
    });

    $("gpxFile")?.addEventListener("change", async function() {
      const f = this.files?.[0];
      $("pickedFileName").textContent = f ? ("✓ Fichier sélectionné : " + f.name) : "";
      if (f) await analyzeGpx();
    });

    $("btnClearGPX")?.addEventListener("click", () => { clearGpx(); showMsg(""); });
    $("btnSave")?.addEventListener("click", () => saveSingle(false));
    $("btnSaveAndNew")?.addEventListener("click", () => saveSingle(true));
    $("btnReset")?.addEventListener("click", () => resetForm(true));
  })();

})();
</script>
