<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un événement – MTB Points</title>

  <!-- ⚠️ Ajuste si ton CSS n'est pas à la racine -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="container">
    <h1>Créer un événement</h1>

    <section class="card">
      <div class="grid">
        <div class="field">
          <label for="mName">Nom de l’événement *</label>
          <input id="mName" type="text" placeholder="Ex: Transriviera VTT" required />
        </div>

        <div class="field">
          <label for="mDate">Date de début *</label>
          <input id="mDate" type="date" required />
        </div>

        <div class="field">
          <label for="mEndDate">Date de fin (optionnelle)</label>
          <input id="mEndDate" type="date" />
        </div>

        <div class="field">
          <label for="mCountry">Pays (optionnel)</label>
          <input id="mCountry" type="text" placeholder="FR" />
        </div>

        <!-- 📍 Point de rendez-vous -->
        <div class="field" style="grid-column: 1 / -1;">
          <label for="mLocation">Point de rendez-vous (adresse) *</label>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input
              id="mLocation"
              type="text"
              placeholder="Tape une adresse (autocomplétion)…"
              autocomplete="off"
              required
              style="flex: 1 1 360px;"
            />
            <button id="btnGeo" type="button">📍 Utiliser ma position</button>
          </div>

          <!-- Dropdown d'autocomplétion -->
          <div id="addrSuggest" class="suggest" style="display:none;"></div>

          <small class="hint">
            Astuce : commence à taper, puis choisis une suggestion. Tu peux aussi utiliser ta position.
          </small>
        </div>

        <div class="field">
          <label for="mLat">Latitude (auto)</label>
          <input id="mLat" type="text" placeholder="ex: 43.7745" readonly />
        </div>

        <div class="field">
          <label for="mLng">Longitude (auto)</label>
          <input id="mLng" type="text" placeholder="ex: 7.4978" readonly />
        </div>

        <div class="field" style="grid-column: 1 / -1;">
          <label for="mComment">Commentaire (optionnel)</label>
          <textarea id="mComment" rows="4" placeholder="Infos organisateur, retrait dossards, etc."></textarea>
        </div>

        <div class="field" style="grid-column: 1 / -1; display:flex; align-items:center; gap:10px;">
          <input id="mPublished" type="checkbox" checked />
          <label for="mPublished" style="margin:0;">Publier l’événement</label>
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
        <button id="btnCreate" type="button">✅ Créer l’événement</button>
        <button id="btnCreateAndRace" type="button">✅ Créer + ajouter une épreuve</button>
        <button id="btnReset" type="button">↩️ Réinitialiser</button>
      </div>

      <div id="msg" style="display:none;"></div>
    </section>
  </main>

  <!-- ⚠️ Ajuste si tes JS ne sont pas dans /js -->
  <script type="module" src="./js/meeting-create.js"></script>

  <!-- Mini CSS (pour les suggestions) : si tu veux, déplace dans style.css -->

      position: relative;
      margin-top: 6px;
      border: 1px solid rgba(40,60,40,.18);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(6px);
      max-height: 260px;
    }
    .suggest .item{
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(40,60,40,.08);
      font-size: 14px;
      line-height: 1.2;
    }
    .suggest .item:last-child{border-bottom:none;}
    .suggest .item:hover{
      background: rgba(22,163,74,.10);
    }
    .hint{opacity:.8; display:block; margin-top:6px;}
    .container{max-width:980px; margin:0 auto; padding:20px;}
    .card{padding:18px; border-radius:18px; border:1px solid rgba(40,60,40,.12);}
    .grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px;}

    .field label{display:block; margin-bottom:6px;}
