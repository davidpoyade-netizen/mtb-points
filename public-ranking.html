<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classement — MTB Points</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-nature.css">

  <style>
    /* Onglets de discipline */
    .disciplineTabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }

    .disciplineTabs button {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      border-radius: 10px 10px 0 0;
      transition: all 0.2s ease;
      white-space: nowrap;
      position: relative;
    }

    .disciplineTabs button:hover {
      background: rgba(47, 111, 62, 0.08);
      color: var(--text);
    }

    .disciplineTabs button.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 -2px 8px rgba(47, 111, 62, 0.15);
    }

    body.theme-nature .disciplineTabs button.active {
      background: linear-gradient(180deg, rgba(47,111,62,1), rgba(37,90,49,1));
    }

    /* Grille 4 colonnes */
    .rankingGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    @media(max-width: 1400px) {
      .rankingGrid { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 768px) {
      .rankingGrid { grid-template-columns: 1fr; }
    }

    .groupTitle {
      grid-column: span 2;
      text-align: center;
      font-weight: 1100;
      font-size: 14px;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px;
      background: rgba(47, 111, 62, 0.08);
      border-radius: 12px;
      border: 1px solid rgba(47, 111, 62, 0.2);
      margin-bottom: -8px;
    }
    @media(max-width: 768px) {
      .groupTitle { grid-column: span 1; }
    }

    .rankingColumn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    body.theme-nature .rankingColumn {
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.80));
      border: 1px solid rgba(40,60,40,.16);
    }

    .rankingColumn h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .rankingColumn .icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    .riderList { list-style: none; padding: 0; margin: 0; }

    .riderItem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      transition: background 0.15s ease;
    }
    .riderItem:hover { background: rgba(47, 111, 62, 0.05); }
    .riderItem:last-child { border-bottom: none; }

    .riderRank {
      font-weight: 1000;
      font-size: 14px;
      color: var(--muted2);
      min-width: 28px;
    }
    .riderRank.top1 { color: #fbbf24; }
    .riderRank.top2 { color: #94a3b8; }
    .riderRank.top3 { color: #d97706; }

    .riderInfo { flex: 1; min-width: 0; }

    .riderName {
      font-weight: 900;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .riderTeam {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .riderPoints {
      font-weight: 1000;
      font-size: 14px;
      color: var(--blue);
      min-width: 50px;
      text-align: right;
    }

    .emptyState {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .compactFilters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    .compactFilters label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 900;
    }
    .compactFilters select,
    .compactFilters input {
      width: auto;
      min-width: 120px;
      padding: 8px 10px;
      margin-top: 0;
    }

    .searchBox { flex: 1; max-width: 300px; position: relative; }
    .searchBox input {
      width: 100%;
      padding: 8px 32px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      font-size: 13px;
    }
    .searchBox input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47,111,62,.1);
    }
    .searchBox .clearBtn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
      display: none;
    }
    .searchBox .clearBtn:hover { color: var(--text); }
    .searchBox.hasValue .clearBtn { display: block; }

    .riderItem.highlighted {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 8px;
      margin: 2px 0;
    }
  </style>
</head>
