<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Classement public — MTB Points</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px }
    .tab {
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      font-weight:900;
      cursor:pointer;
    }
    .tab.active { background:#eff6ff; color:var(--blue2); border-color:#bfdbfe }

    .rankingGrid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:14px;
    }
    @media(max-width:900px){ .rankingGrid{grid-template-columns:1fr} }

    .panel {
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      overflow:hidden;
    }
    .panelHead {
      padding:12px 14px;
      font-weight:1000;
      background:#f8fafc;
      border-bottom:1px solid var(--border);
    }
    table { width:100%; border-collapse:collapse }
    th, td {
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      font-size:13px;
      text-align:left;
    }
    th { font-size:12px; color:#475569 }
    .rank { font-weight:1000 }
    .points { font-weight:1000 }
  </style>
</head>

<body>
<header class="header">
  <h1>MTB Points — Classement public</h1>
  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html" class="active">Classement</a>
    <a href="meetings.html">Événements</a>
  </nav>
</header>

<main class="wrap">
  <div class="card">

    <!-- TABS -->
    <div class="tabs" id="tabs"></div>

    <!-- FILTERS -->
    <div class="filters">
      <div>
        <label>Recherche</label>
        <input id="q" placeholder="Nom rider, club…" />
      </div>
      <div>
        <label>Pays</label>
        <select id="nat"><option value="">Tous</option></select>
      </div>
      <div>
        <label>Catégorie âge</label>
        <select id="cat"><option value="">Toutes</option></select>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content"></div>

  </div>
</main>

<script>
/* ===========================
   CONFIGURATION DES ONGLES
=========================== */
const TABS = [
  { key:"global", label:"Global" },
  { key:"xcc", label:"XCC" },
  { key:"xco", label:"XCO" },
  { key:"xcm", label:"XCM" },
  { key:"gravel", label:"Gravel" },
  { key:"dh", label:"DH" },
  { key:"enduro", label:"Enduro" },
  { key:"club", label:"Clubs" },
];

let ACTIVE_TAB = "global";

/* ===========================
   INIT TABS
=========================== */
const tabsEl = document.getElementById("tabs");
TABS.forEach(t => {
  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = t.label;
  b.onclick = () => {
    ACTIVE_TAB = t.key;
    render();
  };
  tabsEl.appendChild(b);
});

/* ===========================
   RENDER
=========================== */
function render(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.textContent.toLowerCase() === ACTIVE_TAB);
  });

  const root = document.getElementById("content");
  root.innerHTML = "";

  if (ACTIVE_TAB === "club") {
    root.innerHTML = `<p class="muted">Classement clubs (à venir)</p>`;
    return;
  }

  // Global → 2 colonnes
  if (ACTIVE_TAB === "global") {
    root.appendChild(buildTwoCols("Hommes","Femmes"));
    return;
  }

  // Disciplines → 2x2
  root.appendChild(buildFourCols());
}

/* ===========================
   BUILDERS
=========================== */
function buildTwoCols(labelM, labelF){
  const grid = document.createElement("div");
  grid.className = "rankingGrid";
  grid.appendChild(panel(labelM));
  grid.appendChild(panel(labelF));
  return grid;
}

function buildFourCols(){
  const grid = document.createElement("div");
  grid.className = "rankingGrid";
  grid.appendChild(panel("Hommes – Musculaire"));
  grid.appendChild(panel("Femmes – Musculaire"));
  grid.appendChild(panel("Hommes – E-bike"));
  grid.appendChild(panel("Femmes – E-bike"));
  return grid;
}

function panel(title){
  const p = document.createElement("div");
  p.className = "panel";
  p.innerHTML = `
    <div class="panelHead">${title}</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Rider</th>
          <th>Cat</th>
          <th>Pays</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" class="muted">Chargement…</td></tr>
      </tbody>
    </table>
  `;
  return p;
}

render();
</script>
</body>
</html>
