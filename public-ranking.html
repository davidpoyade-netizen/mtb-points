<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classement public — MTB Points</title>

  <link rel="stylesheet" href="./css/style.css" />
  <!-- thème nature (si tu l’as déjà dans ton projet) -->
  <link rel="stylesheet" href="./css/theme-nature.css" />

  <style>
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .tab{
      border:1px solid var(--border);
      background:rgba(255,255,255,.75);
      border-radius:999px;
      padding:9px 12px;
      font-weight:1000;
      font-size:13px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .tab:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(2,6,23,.08)}
    .tab.active{background:#fff;border-color:#bfdbfe;box-shadow:var(--shadow)}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    @media(max-width:980px){.grid2{grid-template-columns:1fr}}
    .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    @media(max-width:980px){.grid4{grid-template-columns:1fr}}

    .panel{
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
      overflow:hidden;
    }
    .panelHead{
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;
      background:rgba(255,255,255,.70);
    }
    .panelHead h3{margin:0;font-size:14px;letter-spacing:-.1px}

    table{width:100%;border-collapse:separate;border-spacing:0}
    thead th{
      position:sticky;top:0;background:#fff;z-index:1;
      text-align:left;font-size:12px;color:#475569;
      padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
    }
    tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
    tbody tr:hover td{background:#fbfdff}
    tbody tr:last-child td{border-bottom:0}

    .rank{font-weight:1000}
    .name{font-weight:1000}
    .small{font-size:12px;color:var(--muted)}
    .points{font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap}
    .empty{padding:14px;border-top:1px dashed var(--border);color:var(--muted)}
  </style>
</head>

<body>
<header class="header">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1>MTB Points — Classement public</h1>
    <span class="pill"><span class="dot ok"></span><span id="pillCount">0</span> affichés</span>
  </div>

  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="public-ranking.html" class="active">Classement</a>
    <a href="meetings.html">Événements</a>
    <a href="challengemtbpoints.html">Challenge</a>
  </nav>
</header>

<main class="wrap">
  <div class="card">

    <section class="hero">
      <div class="heroTop">
        <div style="min-width:260px;flex:1">
          <h2>Global / Disciplines / Clubs</h2>
          <p class="muted" style="margin:6px 0 0 0;">
            Données : <code>v_public_results_enriched</code> (riders) & <code>v_public_clubs_ranking</code> (clubs).
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="pill"><span class="dot"></span><span id="pillMode">Global</span></span>
          <span class="pill"><span class="dot"></span><span id="pillRows">0</span> lignes</span>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
    </section>

    <div class="filters">
      <div class="spanAll">
        <label for="q">Recherche</label>
        <input id="q" type="text" placeholder="Nom rider / club…" />
      </div>

      <div>
        <label for="nat">Pays</label>
        <select id="nat"><option value="">Tous</option></select>
      </div>

      <div>
        <label for="cat">Catégorie d’âge</label>
        <select id="cat"><option value="">Toutes</option></select>
      </div>

      <div>
        <label for="ageMin">Âge min</label>
        <input id="ageMin" type="number" min="0" placeholder="ex: 18" />
      </div>

      <div>
        <label for="ageMax">Âge max</label>
        <input id="ageMax" type="number" min="0" placeholder="ex: 49" />
      </div>

      <div>
        <label for="minPts">Points min</label>
        <input id="minPts" type="number" min="0" placeholder="ex: 500" />
      </div>

      <div>
        <label for="sortBy">Tri</label>
        <select id="sortBy">
          <option value="points_desc">Points ↓</option>
          <option value="points_asc">Points ↑</option>
          <option value="name_asc">Nom A→Z</option>
        </select>
      </div>

      <div style="display:flex;align-items:flex-end">
        <button class="btn" id="btnReset" type="button" style="width:100%">Réinitialiser</button>
      </div>
    </div>

    <div id="content"></div>

  </div>
</main>

<script type="module">
import { supabase } from "./js/supabaseClient.js";
